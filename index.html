<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#edebe3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moon Journal">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23edebe3' stroke='%231a1a1a' stroke-width='3'/%3E%3Cpath d='M16 2a14 14 0 0 1 0 28' fill='%231a1a1a'/%3E%3C/svg%3E">
<title>Moon Journal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Merriweather+Sans:ital,wght@0,300;0,700;1,300&display=swap">
<style>
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one phone-width column — date + live compass, 24h moon chart, journal, floating round nav. Single light "paper" look from the Figma file. */
:root {
  --paper: #edebe3;
  --ink: #1a1a1a;
  --mute: #848484;
  --now: #2777e7;
  --scrim: rgba(26, 26, 26, 0.28);
  --serif: "Merriweather", Georgia, "Times New Roman", serif;
  --sans: "Merriweather Sans", "Trebuchet MS", system-ui, sans-serif;
  --stroke: 3px;
  --radius: 40px;
  color-scheme: light;
}
/* The page never scrolls; only the journal text and photos do. */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; }
* { touch-action: manipulation; }   /* no double-tap zoom */
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--now); outline-offset: 3px; }
svg { display: block; }

.app {
  position: fixed; left: 0; right: 0; margin: 0 auto;
  top: var(--app-top, 0px); height: var(--app-h, 100%);
  box-sizing: border-box; max-width: calc(386px + 2 * max(16px, env(safe-area-inset-left, 0px)));
  display: flex; flex-direction: column;
  padding-top: max(36px, calc(env(safe-area-inset-top, 0px) + 14px));
  padding-left: calc(max(16px, env(safe-area-inset-left, 0px)) + 8px);
  padding-right: calc(max(16px, env(safe-area-inset-right, 0px)) + 8px);
  padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px));   /* room for the day buttons */
}
body.writing .app { padding-bottom: 0; }
body.not-today:not(.writing) .app { padding-bottom: calc(138px + env(safe-area-inset-bottom, 0px)); }   /* room for the Today button */
.top-area { flex: none; }
.app.sliding { transition: transform 0.2s ease, opacity 0.2s ease; }
@media (prefers-reduced-motion: reduce) { .app.sliding { transition: none; } }
body.writing .top-area { display: none; }

/* Header */
.top { position: relative; height: 98px; padding-left: 4px; }
.date {
  font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1.25;
  margin: 0; text-align: left; text-wrap: balance;
}
.place {
  display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--mute);
  text-decoration: underline dotted 1.5px; text-underline-offset: 4px; text-align: left; padding: 2px 0;
}
.compass {
  position: absolute; z-index: 3;
  top: -13px; right: 0;
  width: 126px; height: 126px;
  touch-action: none; cursor: grab;
}
.compass.dragging { cursor: grabbing; }
#ring { transition: transform 0.25s linear; transform-origin: 63px 63px; }
.compass.dragging #ring, .compass.live #ring { transition: none; }

/* Chart */
.chart-wrap { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: ew-resize; }
#chart { width: 100%; height: 208px; overflow: visible; }
.markers { position: relative; height: 48px; margin-top: 8px; }
.marker {
  position: absolute; top: 0; transform: translateX(-50%); padding: 0 4px 4px; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-weight: 700; font-size: 12px; letter-spacing: -0.02em; color: var(--mute);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.marker.now { color: var(--now); z-index: 1; pointer-events: none; }
button.marker { cursor: pointer; }
button.marker:active { transform: translateX(-50%) scale(0.94); }
.marker-moon, .marker-moon svg { display: block; width: 16px; height: 16px; }
.marker small { font-size: 10px; font-weight: 300; letter-spacing: 0; margin-top: -3px; }

/* Journal */
.journal { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 9px; padding: 0 4px; }
.journal-head {
  flex: none; position: relative; z-index: 4;
  display: flex; align-items: center; gap: 10px; min-height: 52px;
  margin: 0 -4px; padding: 0 4px; background: var(--paper);
}
.journal-head h2 { font-family: var(--serif); font-weight: 700; font-size: 16px; margin: 0; }
.save-state { font-size: 12px; font-weight: 700; color: var(--mute); opacity: 0; transition: opacity 0.3s; }
.save-state.show { opacity: 1; }
.save-state.warn { color: #b0412e; opacity: 1; }
.icon-btn { margin-left: auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
.save-btn {
  height: 36px; padding: 0 18px; border-radius: var(--radius);
  background: var(--ink); color: var(--paper);
  font-family: var(--sans); font-weight: 700; font-size: 13px;
}
.save-btn:active { transform: scale(0.95); }
.save-btn { display: none; }
body.writing .save-btn { display: block; }
.journal-scroll {
  position: relative; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; margin: 0 -4px; padding: 0 4px 24px; touch-action: pan-y;
}
body.writing .journal-scroll { padding-bottom: 32px; }
#entry {
  display: block; width: 100%; min-height: 84px; margin: 2px 0 0; padding: 0;
  border: 0; outline: none; resize: none; overflow: hidden;
  background: transparent; color: var(--ink);
  font-family: var(--sans); font-weight: 300; font-size: 14px; line-height: 21px;
}
#entry::placeholder { font-style: italic; color: var(--ink); opacity: 0.8; }
.photos { display: flex; flex-direction: column; gap: 16px; margin: 16px -4px 0; }
.photos:empty { display: none; }
.photo {
  display: block; width: 100%; aspect-ratio: 354 / 208; max-width: 100%;
  border-radius: var(--radius); overflow: hidden; background: var(--ink);
}
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Round buttons */
.nav {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
  bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; align-items: center;
}
body.writing .nav { display: none; }
.today-btn { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); height: 36px; }
.nav .today-btn:active { transform: translateX(-50%) scale(0.94); }
.round {
  height: 40px; min-width: 40px; border: var(--stroke) solid var(--ink); border-radius: var(--radius);
  background: var(--paper); display: grid; place-items: center;
}
.round.wide { width: 56px; }
.round.pill { padding: 0 16px; font-weight: 700; font-size: 13px; }
.round:active { transform: scale(0.94); }
.round svg { width: 24px; height: 24px; }

/* Calendar sheet */
/* Overlays start below the status bar, and a paper band always covers the status bar,
   so the phone never tints the area around the Dynamic Island with the dark overlay. */
.overlay {
  position: fixed; top: env(safe-area-inset-top, 0px); right: 0; bottom: 0; left: 0; z-index: 20; background: var(--scrim);
  display: grid; place-items: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px);
  background: var(--paper); z-index: 30; pointer-events: none;
}
.sheet {
  box-sizing: border-box; width: 100%; max-width: 370px; background: var(--paper);
  border: var(--stroke) solid var(--ink); border-radius: var(--radius);
  padding: 22px 18px 18px;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px; }
.sheet-head h2 { font-family: var(--serif); font-weight: 700; font-size: 18px; margin: 0; text-align: center; }
.weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.weekdays { margin: 18px 0 6px; }
.weekdays span { text-align: center; font-size: 11px; font-weight: 700; color: var(--mute); }
.day {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 0 7px; border: var(--stroke) solid transparent; border-radius: 16px;
  font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
}
.day.other { opacity: 0.35; }
.day.today { color: var(--now); }
.day.selected { border-color: var(--ink); }
.day .dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--now); }
.day svg { width: 18px; height: 18px; }
.sheet-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
.legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mute); font-weight: 700; }
.legend i { width: 6px; height: 6px; border-radius: 50%; background: var(--now); display: inline-block; }

/* Photo viewer */
.viewer { background: var(--paper); place-items: stretch; }
.viewer-inner { display: flex; flex-direction: column; gap: 20px; height: 100%; max-width: 370px; margin: 0 auto; width: 100%; }
.viewer-img { flex: 1; min-height: 0; border-radius: var(--radius); overflow: hidden; background: var(--ink); }
.viewer-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.viewer-bar { display: flex; justify-content: center; gap: 8px; padding-bottom: 16px; }

/* Moon detail sheet */
.info-top { display: flex; align-items: center; gap: 16px; margin-top: 16px; padding: 0 2px; }
.info-time { font-family: var(--serif); font-weight: 700; font-size: 28px; margin: 0; font-variant-numeric: tabular-nums; }
.info-kind { font-size: 12px; font-weight: 700; color: var(--mute); margin: 2px 0 0; }
.info-dial { width: 76px; height: 76px; margin-left: auto; flex: none; }
.facts { margin: 18px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.facts div { border: var(--stroke) solid var(--ink); border-radius: 20px; padding: 10px 14px 12px; }
.facts dt { font-size: 11px; font-weight: 700; color: var(--mute); }
.facts dd { margin: 4px 0 0; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.facts dd small { display: block; font-size: 11px; font-weight: 300; margin-top: 2px; }
.info-note { margin: 14px 2px 0; font-size: 13px; font-weight: 300; line-height: 1.5; }
.info-note:empty { display: none; }

/* Sign-in */
.login {
  position: fixed; inset: 0; overflow-y: auto; display: grid; place-items: center;
  padding: max(32px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.login-inner { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.login-moon { width: 112px; height: 112px; }
.login h1 { font-family: var(--serif); font-weight: 700; font-size: 28px; margin: 22px 0 6px; }
.login-sub { margin: 0 0 26px; font-size: 13px; font-weight: 300; line-height: 1.5; text-wrap: balance; }
.login form { width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: left; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--mute); }
.field input {
  height: 48px; padding: 0 18px; border: var(--stroke) solid var(--ink); border-radius: 24px;
  background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; font-weight: 300;
  box-sizing: border-box; width: 100%; outline: none;
}
.field input:focus-visible { box-shadow: 0 0 0 3px var(--now); }
.wide-btn { display: block; width: 100%; height: 48px; margin-top: 6px; font-size: 15px; }
.wide-btn[disabled] { opacity: 0.6; }
.link-btn { align-self: center; font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
.form-msg { margin: 0; min-height: 20px; text-align: center; font-size: 13px; font-weight: 300; line-height: 1.5; }
.version { margin: 28px 0 0; font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; }
.form-msg.error { color: #b0412e; font-weight: 700; }
.account { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 12px 4px 0; border-top: 1.5px dashed var(--mute); font-size: 12px; color: var(--mute); }
.account span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.account .link-btn { color: var(--ink); padding: 4px 0; flex: none; }
.compass-hint {
  position: absolute; z-index: 4; top: 116px; right: 13px; width: 100px; text-align: center;
  font-size: 10px; font-weight: 700; color: var(--mute); background: var(--paper); border-radius: 8px; padding: 2px 0;
}

/* Location */
.loc-field { margin-top: 18px; }
.loc-field input { font-size: 16px; }
.loc-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; max-height: 46vh; overflow-y: auto; }
.loc-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: var(--stroke) solid var(--ink); border-radius: 20px; padding: 10px 14px; box-sizing: border-box; }
.loc-row b { display: block; font-size: 14px; }
.loc-row small { display: block; font-size: 12px; font-weight: 300; margin-top: 2px; }
.loc-row .check { margin-left: auto; flex: none; width: 20px; height: 20px; }

/* Reminders */
.rem-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.rem-row { display: flex; align-items: center; gap: 14px; border: var(--stroke) solid var(--ink); border-radius: 20px; padding: 12px 14px; cursor: pointer; }
.rem-row b { display: block; font-size: 14px; }
.rem-row small { display: block; font-size: 12px; font-weight: 300; margin-top: 2px; line-height: 1.4; }
.rem-row input { position: absolute; opacity: 0; pointer-events: none; }
.switch { margin-left: auto; flex: none; width: 44px; height: 26px; border: var(--stroke) solid var(--ink); border-radius: 20px; position: relative; box-sizing: border-box; transition: background 0.15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform 0.15s; }
.rem-row input:checked + .switch { background: var(--ink); }
.rem-row input:checked + .switch::after { background: var(--paper); transform: translateX(18px); }
.rem-row input:focus-visible + .switch { outline: 2px solid var(--now); outline-offset: 2px; }
.rem-list.off .rem-row { opacity: 0.45; pointer-events: none; }
.rem-actions { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 16px; }

@media (prefers-reduced-motion: reduce) { #ring { transition: none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="4.4" height="4.4" patternTransform="rotate(41)">
      <line x1="0" y1="-1" x2="0" y2="6" stroke="#1a1a1a" stroke-width="1.2"></line>
    </pattern>
    <pattern id="hatchSm" patternUnits="userSpaceOnUse" width="2.6" height="2.6" patternTransform="rotate(41)">
      <line x1="0" y1="-1" x2="0" y2="4" stroke="#1a1a1a" stroke-width="1"></line>
    </pattern>
    <symbol id="i-moon" viewBox="0 0 16 16">
      <rect width="16" height="16" rx="8" fill="#edebe3"></rect>
      <path d="M14 8.53A6 6 0 1 1 7.47 2 4.67 4.67 0 0 0 14 8.53Z" fill="#edebe3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="6.67" fill="none" stroke="currentColor" stroke-width="2"></circle>
      <path d="M8 4v4l2.67 1.33" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="i-cal" viewBox="0 0 24 24">
      <path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2ZM16 2v4M8 2v4M3 10h18" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="i-camera" viewBox="0 0 24 24">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2v11Z" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="12" cy="13" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"></circle>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
  </defs>
</svg>

<section class="login" id="login" hidden>
  <div class="login-inner">
    <div class="login-moon" id="loginMoon" aria-hidden="true"></div>
    <h1>Moon Journal</h1>
    <p class="login-sub" id="loginSub">Sign in to see tonight's moon and your journal.</p>
    <form id="loginForm" novalidate>
      <label class="field">Email<input id="email" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="save-btn wide-btn" id="loginBtn" type="submit">Sign in</button>
      <button class="link-btn" id="forgotBtn" type="button">Forgot password?</button>
      <p class="form-msg" id="loginMsg" aria-live="polite"></p>
    </form>
    <form id="resetForm" novalidate hidden>
      <label class="field">New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="save-btn wide-btn" id="resetBtn" type="submit">Save new password</button>
      <p class="form-msg" id="resetMsg" aria-live="polite"></p>
    </form>
    <p class="version" id="versionTag">Version 2026-10-26i</p>
  </div>
</section>

<div id="appRoot" hidden>
<main class="app">
  <div class="top-area" id="topArea">
  <header class="top">
    <span class="compass-hint" id="compassHint" hidden>Tap compass to turn on</span>
    <h1 class="date" id="dateTitle">Monday,<br>10/26</h1>
    <button class="place" id="placeBtn" type="button" aria-label="Change location"><span id="placeName">Wellesley, MA</span></button>
    <div class="compass" id="compass" role="img" aria-label="Compass showing the Moon's direction">
      <svg viewBox="0 0 126 126" width="126" height="126">
        <circle cx="63" cy="63" r="63" fill="#edebe3"></circle>
        <g id="ring">
          <circle cx="63.06" cy="63.05" r="54.57" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-dasharray="1 2"></circle>
          <g id="letters"></g>
          <g id="ringMoon"></g>
        </g>
        <circle cx="63.07" cy="63.06" r="46.68" fill="none" stroke="#1a1a1a" stroke-width="3"></circle>
        <path id="phaseArcPath" fill="none"></path>
        <text font-family="Merriweather Sans, sans-serif" font-weight="700" font-size="8.6" letter-spacing="0.9" fill="#1a1a1a">
          <textPath id="phaseText" href="#phaseArcPath" startOffset="50%" text-anchor="middle">WAXING GIBBOUS</textPath>
        </text>
        <g id="phaseMoon"></g>
        <g id="wxIcon"></g>
      </svg>
    </div>
  </header>

  <section class="chart-wrap" id="chartWrap" aria-label="Moon height over the day. Drag to scrub through the day.">
    <svg id="chart" height="208"></svg>
    <div class="markers" id="markers"></div>
  </section>

  </div>
  <section class="journal" id="journal">
    <div class="journal-head" id="journalHead">
      <h2>Journal Entry</h2>
      <span class="save-state" id="saveState" aria-live="polite"></span>
      <button class="icon-btn" id="cameraBtn" aria-label="Add a photo"><svg width="24" height="24"><use href="#i-camera"></use></svg></button>
      <button class="save-btn" id="saveBtn">Save</button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
    <div class="journal-scroll" id="journalScroll">
      <textarea id="entry" rows="3" placeholder="Tap to start writing..." aria-label="Journal entry"></textarea>
      <div class="photos" id="photos"></div>
    </div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(() => {
  // ---------- Settings ----------
  // Where the Moon is calculated for. Starts at Wellesley, MA and switches to the
  // phone's current location when the browser shares it. Coordinates are rounded to
  // two decimals (about 1 km, roughly ZIP-code level).
  const DEFAULT_LOC = { lat: 42.2985, lng: -71.2840, label: "Wellesley, MA", source: "default" };
  let LOC = DEFAULT_LOC;
  const DAY_WINDOW = [9 * 60, 23 * 60];          // waking hours, minutes
  const STEP = 5;                                 // sampling step, minutes
  const RAD = Math.PI / 180;
  const $ = (id) => document.getElementById(id);

  // ---------- Backend (Supabase) ----------
  const RAW = window.MOON_CONFIG || {};
  // Accept the project URL with or without extra parts like /rest/v1/, and ignore stray spaces.
  const cleanUrl = (u) => { try { return new URL(String(u).trim()).origin; } catch (e) { return String(u || "").trim(); } };
  const CFG = { supabaseUrl: cleanUrl(RAW.supabaseUrl), supabaseAnonKey: String(RAW.supabaseAnonKey || "").trim(), vapidPublicKey: String(RAW.vapidPublicKey || "").trim() };
  const configured = !!(window.supabase && CFG.supabaseUrl && CFG.supabaseAnonKey && !/YOUR-/.test(CFG.supabaseUrl + CFG.supabaseAnonKey));
  const sb = configured ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
  let uid = null;
  const must = ({ data, error }) => { if (error) throw error; return data; };
  const Store = {
    async get(date) {
      return must(await sb.from("entries").select("date,text,photos,updated_at").eq("date", date).maybeSingle());
    },
    async put(e) {
      must(await sb.from("entries").upsert({ user_id: uid, date: e.date, text: e.text, photos: e.photos, moon: e.moon, updated_at: e.updatedAt }, { onConflict: "user_id,date" }));
    },
    async remove(date) { must(await sb.from("entries").delete().eq("date", date)); },
    async dates(from, to) {
      const rows = must(await sb.from("entries").select("date").gte("date", from).lte("date", to));
      return new Set(rows.map((r) => r.date));
    },
    async upload(path, blob) {
      must(await sb.storage.from("photos").upload(path, blob, { contentType: blob.type || "image/jpeg", upsert: false }));
    },
    async urls(paths) {
      if (!paths.length) return {};
      const rows = must(await sb.storage.from("photos").createSignedUrls(paths, 60 * 60 * 6));
      const out = {};
      rows.forEach((r) => { if (r.signedUrl) out[r.path] = r.signedUrl; });
      return out;
    },
    async removeFiles(paths) { if (paths.length) must(await sb.storage.from("photos").remove(paths)); },
  };
  // Unsaved text is kept on this device until the server confirms the save.
  const Draft = {
    key: (date) => `moon-draft:${uid}:${date}`,
    get(date) { try { return JSON.parse(localStorage.getItem(this.key(date)) || "null"); } catch (e) { return null; } },
    set(date, text) { try { localStorage.setItem(this.key(date), JSON.stringify({ text, at: new Date().toISOString() })); } catch (e) {} },
    clear(date) { try { localStorage.removeItem(this.key(date)); } catch (e) {} },
  };

  // ---------- Date helpers ----------
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const atMinutes = (k, m) => { const d = fromKey(k); d.setMinutes(m); return d; };
  const nowMinutes = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60; };
  function fmtTime(min) {
    min = Math.round(min);
    let h = Math.floor(min / 60) % 24, m = min % 60;
    const ap = h >= 12 ? "pm" : "am";
    h = h % 12 || 12;
    return `${h}:${pad(m)}${ap}`;
  }
  const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  // ---------- Astronomy ----------
  function moonAt(date) {
    const p = SunCalc.getMoonPosition(date, LOC.lat, LOC.lng);
    const s = SunCalc.getPosition(date, LOC.lat, LOC.lng);
    return {
      alt: p.altitude / RAD,
      bearing: ((p.azimuth / RAD) + 180 + 360) % 360,
      sunAlt: s.altitude / RAD,
      sunBearing: ((s.azimuth / RAD) + 180 + 360) % 360,
    };
  }
  function separation(a1, z1, a2, z2) {
    const c = Math.sin(a1 * RAD) * Math.sin(a2 * RAD) + Math.cos(a1 * RAD) * Math.cos(a2 * RAD) * Math.cos((z1 - z2) * RAD);
    return Math.acos(Math.max(-1, Math.min(1, c))) / RAD;
  }
  const POINTS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
  const cardinal = (b) => POINTS[Math.round(b / 22.5) % 16];
  function phaseName(p) {
    if (p < 0.0339 || p >= 0.9661) return "New Moon";
    if (p < 0.216) return "Waxing Crescent";
    if (p < 0.284) return "First Quarter";
    if (p < 0.466) return "Waxing Gibbous";
    if (p < 0.534) return "Full Moon";
    if (p < 0.716) return "Waning Gibbous";
    if (p < 0.784) return "Last Quarter";
    return "Waning Crescent";
  }

  const dayCache = new Map();
  function dayData(k) {
    if (dayCache.has(k)) return dayCache.get(k);
    const samples = [];
    for (let m = 0; m <= 1440; m += STEP) {
      const d = atMinutes(k, m);
      const pos = moonAt(d);
      const ill = SunCalc.getMoonIllumination(d);
      samples.push({ m, ...pos, frac: ill.fraction, elong: separation(pos.alt, pos.bearing, pos.sunAlt, pos.sunBearing) });
    }
    // Nights: sun below the horizon (accounting for refraction / disc)
    const nights = [];
    let start = null;
    samples.forEach((s, i) => {
      const dark = s.sunAlt < -0.833;
      if (dark && start === null) start = s.m;
      if ((!dark || i === samples.length - 1) && start !== null) { nights.push([start, dark ? s.m : s.m - STEP / 2]); start = null; }
    });
    // Best time to look, always picked. Each list is tried in order; the first one with
    // any samples wins, and within it the highest Moon wins.
    const waking = (s) => s.m >= DAY_WINDOW[0] && s.m <= DAY_WINDOW[1];
    const highest = (list) => list.reduce((a, b) => (!a || b.alt > a.alt + 0.01 ? b : a), null);
    const firstNonEmpty = (...lists) => lists.find((l) => l.length) || [];
    const daylight = samples.filter((s) => s.sunAlt > 0);
    const goodDay = (s) => s.alt > 10 && s.elong > 20;
    const day = highest(firstNonEmpty(
      daylight.filter((s) => waking(s) && goodDay(s)),
      daylight.filter(goodDay),
      daylight.filter((s) => s.alt > 0),
      daylight));
    let dark = samples.filter((s) => s.sunAlt < -6);
    if (!dark.length) dark = samples.filter((s) => s.sunAlt < 0);
    const evening = (s) => s.m >= 720 && s.m <= DAY_WINDOW[1];
    const night = highest(firstNonEmpty(
      dark.filter((s) => evening(s) && s.alt > 10),
      dark.filter((s) => s.alt > 10),
      dark.filter((s) => s.alt > 0),
      dark));
    const noon = atMinutes(k, 720);
    const ill = SunCalc.getMoonIllumination(noon);
    const times = SunCalc.getMoonTimes(fromKey(k), LOC.lat, LOC.lng);
    const toMin = (t) => (t ? t.getHours() * 60 + t.getMinutes() : null);
    const data = {
      samples, nights, day, night,
      phase: ill.phase, fraction: ill.fraction, phaseName: phaseName(ill.phase),
      rise: toMin(times.rise), set: toMin(times.set),
    };
    dayCache.set(k, data);
    return data;
  }

  // Snapshot saved with each entry
  function moonSnapshot(k) {
    const d = dayData(k);
    const pick = (s) => s && { time: fmtTime(s.m), bearing: Math.round(s.bearing), direction: cardinal(s.bearing), altitude: Math.round(s.alt), illumination: Math.round(s.frac * 100) };
    return {
      location: { lat: LOC.lat, lng: LOC.lng, label: LOC.label, source: LOC.source },
      phase: d.phaseName,
      illumination: Math.round(d.fraction * 100),
      moonrise: d.rise != null ? fmtTime(d.rise) : null,
      moonset: d.set != null ? fmtTime(d.set) : null,
      mostVisibleDay: pick(d.day),
      mostVisibleNight: pick(d.night),
    };
  }

  // ---------- Moon phase drawing (hatched = shadow, plain = lit) ----------
  function litPath(cx, cy, r, phase) {
    const k = Math.cos(2 * Math.PI * phase);
    const frac = (1 - k) / 2;
    if (frac < 0.01) return "";
    if (frac > 0.99) return `M ${cx - r} ${cy} A ${r} ${r} 0 1 0 ${cx + r} ${cy} A ${r} ${r} 0 1 0 ${cx - r} ${cy} Z`;
    const waxing = phase < 0.5;
    const rx = Math.abs(k) * r;
    const top = `${cx} ${cy - r}`, bot = `${cx} ${cy + r}`;
    const limbSweep = waxing ? 1 : 0;
    const crescent = frac < 0.5;
    const termSweep = waxing ? (crescent ? 0 : 1) : (crescent ? 1 : 0);
    return `M ${top} A ${r} ${r} 0 0 ${limbSweep} ${bot} A ${rx} ${r} 0 0 ${termSweep} ${top} Z`;
  }
  function phaseIcon(phase, size, stroke = 1.5, pattern = "hatchSm") {
    const r = size / 2 - stroke / 2 - 0.5, c = size / 2;
    return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle cx="${c}" cy="${c}" r="${r}" fill="url(#${pattern})"></circle>
      <path d="${litPath(c, c, r, phase)}" fill="#edebe3"></path>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#1a1a1a" stroke-width="${stroke}"></circle></svg>`;
  }

  // ---------- Compass ----------
  const compass = $("compass"), ring = $("ring");
  const CX = 63.06, CY = 63.05, RING_R = 55.2;
  (function buildRing() {
    const L = [["N", 0], ["E", 90], ["S", 180], ["W", 270]];
    $("letters").innerHTML = L.map(([t, b]) => `
      <g transform="rotate(${b} ${CX} ${CY})">
        <circle cx="${CX}" cy="${CY - RING_R}" r="6.9" fill="#edebe3"></circle>
        <text x="${CX}" y="${CY - RING_R + 3.2}" text-anchor="middle" font-family="Merriweather, Georgia, serif" font-weight="700" font-size="9" fill="#1a1a1a">${t}</text>
      </g>`).join("");
    // Arc for curved phase text: from upper-left, round the bottom, to upper-right.
    const tr = 39.5, at = (b) => [CX + tr * Math.sin(b * RAD), CY - tr * Math.cos(b * RAD)];
    const p0 = at(290), p1 = at(70);   // counter-clockwise from upper-left, under the bottom, to upper-right
    $("phaseArcPath").setAttribute("d", `M ${p0[0]} ${p0[1]} A ${tr} ${tr} 0 1 0 ${p1[0]} ${p1[1]}`);
  })();

  let heading = 0;      // degrees the phone points to (0 = north)
  let ringAngle = 0;    // unwrapped rotation applied to the ring
  function setHeading(h) {
    heading = ((h % 360) + 360) % 360;
    const target = -heading;
    let delta = ((target - ringAngle) % 360 + 540) % 360 - 180;
    ringAngle += delta;
    ring.style.transform = `rotate(${ringAngle}deg)`;
  }
  function drawCompassMoon(bearing, alt) {
    const a = bearing * RAD;
    const x = CX + RING_R * Math.sin(a), y = CY - RING_R * Math.cos(a);
    const below = alt < 0;
    $("ringMoon").innerHTML = `
      <g transform="translate(${x - 7} ${y - 7})">
        <rect width="14" height="14" rx="7" fill="#edebe3"></rect>
        <g transform="translate(1 1)" opacity="${below ? 0.45 : 1}"><path d="M10.5 6.395A4.53 4.53 0 1 1 5.605 1.5 3.52 3.52 0 0 0 10.5 6.395Z" fill="#edebe3" stroke="#2777e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g>
      </g>`;
    compass.setAttribute("aria-label", `Moon is ${Math.round(bearing)}° from north and ${Math.round(alt)}° ${below ? "below" : "above"} the horizon`);
  }
  function drawPhase(d) {
    $("phaseMoon").innerHTML = `
      <circle cx="63.06" cy="63.05" r="25.92" fill="url(#hatch)"></circle>
      <path d="${litPath(63.06, 63.05, 25.92, d.phase)}" fill="#edebe3"></path>
      <circle cx="63.06" cy="63.05" r="25.92" fill="none" stroke="#1a1a1a" stroke-width="3"></circle>`;
    $("phaseText").textContent = d.phaseName.toUpperCase();
  }

  // Live heading from the phone's compass, where the browser allows it.
  let sensorLive = false;
  function onOrient(e) {
    let h = null;
    if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;
    else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;
    if (h == null) return;
    const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    sensorLive = true;
    $("compassHint").hidden = true;
    compass.classList.add("live");
    setHeading(h + so);
  }
  window.addEventListener("deviceorientationabsolute", onOrient);
  window.addEventListener("deviceorientation", onOrient);
  const needsTap = !!(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function");
  compass.addEventListener("click", () => { askSensor(); });
  async function askSensor() {
    try {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
        await DeviceOrientationEvent.requestPermission();
      }
      $("compassHint").hidden = true;
    } catch (e) { /* not allowed here; manual turning still works */ }
  }

  // Manual turning: drag around the compass to line N up yourself.
  (function manualTurn() {
    let last = null, moved = false;
    const angleOf = (e) => {
      const r = compass.getBoundingClientRect();
      return Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) / RAD;
    };
    compass.addEventListener("pointerdown", (e) => {
      if (sensorLive) return;
      last = angleOf(e); moved = false;
      compass.setPointerCapture(e.pointerId);
      compass.classList.add("dragging");
    });
    compass.addEventListener("pointermove", (e) => {
      if (last == null) return;
      const a = angleOf(e);
      let d = ((a - last) % 360 + 540) % 360 - 180;
      last = a; moved = true;
      setHeading(heading - d);
    });
    const end = () => { last = null; compass.classList.remove("dragging"); };
    compass.addEventListener("pointerup", end);
    compass.addEventListener("pointercancel", end);
  })();

  // ---------- Chart ----------
  const chart = $("chart"), chartWrap = $("chartWrap"), markers = $("markers");
  const H = 208, INSET = 1.5;
  let W = 354;
  const xOf = (m) => INSET + (m / 1440) * (W - 2 * INSET);
  const yOf = (alt) => 8 + ((90 - alt) / 180) * (H - 16);
  const mOf = (clientX) => {
    const r = chart.getBoundingClientRect();
    return Math.max(0, Math.min(1439, ((clientX - r.left - INSET) / (r.width - 2 * INSET)) * 1440));
  };

  function drawChart(d) {
    W = chart.getBoundingClientRect().width || 354;
    chart.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const pts = d.samples.map((s) => [xOf(s.m), yOf(s.alt)]);
    const line = "M " + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ");
    const hatch = d.nights.map(([a, b]) => {
      const seg = d.samples.filter((s) => s.m >= a && s.m <= b);
      if (seg.length < 2) return "";
      return `M ${xOf(seg[0].m)} ${H} ` + seg.map((s) => `L ${xOf(s.m).toFixed(1)} ${yOf(s.alt).toFixed(1)}`).join(" ") + ` L ${xOf(seg[seg.length - 1].m)} ${H} Z`;
    }).join(" ");
    const rx = 38.5;
    const vline = (m, color, id) => m == null ? "" :
      `<line ${id ? `id="${id}"` : ""} x1="${xOf(m)}" x2="${xOf(m)}" y1="0" y2="${H}" stroke="${color}" stroke-width="3"></line>`;
    chart.innerHTML = `
      <defs><clipPath id="chartClip"><rect x="${INSET}" y="${INSET}" width="${W - 2 * INSET}" height="${H - 2 * INSET}" rx="${rx}"></rect></clipPath></defs>
      <g clip-path="url(#chartClip)">
        <path d="${hatch}" fill="url(#hatch)"></path>
        <line x1="0" x2="${W}" y1="${yOf(0)}" y2="${yOf(0)}" stroke="#848484" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"></line>
        <path d="${line}" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"></path>
        ${vline(d.day && d.day.m, "#848484")}
        ${vline(d.night && d.night.m, "#848484")}
        ${vline(0, "#2777e7", "nowLine")}
      </g>
      <rect x="${INSET}" y="${INSET}" width="${W - 2 * INSET}" height="${H - 2 * INSET}" rx="${rx}" fill="none" stroke="#1a1a1a" stroke-width="3"></rect>`;
  }

  function drawMarkers(d, m) {
    const items = [];
    // Each marker shows the Moon's phase at that time, drawn like the calendar tiles.
    const phaseAt = (mm) => phaseIcon(SunCalc.getMoonIllumination(atMinutes(state.date, mm)).phase, 16, 1.5);
    if (d.day) items.push({ x: xOf(d.day.m), kind: "day", html: `<span class="marker-moon">${phaseAt(d.day.m)}</span>${fmtTime(d.day.m)}<small>day</small>`, cls: "" });
    if (d.night) items.push({ x: xOf(d.night.m), kind: "night", html: `<span class="marker-moon">${phaseAt(d.night.m)}</span>${fmtTime(d.night.m)}<small>night</small>`, cls: "" });
    items.push({ x: xOf(m), html: `<svg width="16" height="16" style="color:#2777e7"><use href="#i-clock"></use></svg>${fmtTime(m)}`, cls: "now" });
    // Keep labels from overlapping: lay out left to right with a minimum gap.
    const GAP = 58;
    const sorted = items.slice().sort((a, b) => a.x - b.x);
    sorted.forEach((it, i) => {
      it.lx = Math.max(it.x, GAP / 2 - 6, i ? sorted[i - 1].lx + GAP : -Infinity);
    });
    for (let i = sorted.length - 1; i >= 0; i--) {
      const max = (i === sorted.length - 1 ? W - GAP / 2 + 6 : sorted[i + 1].lx - GAP);
      sorted[i].lx = Math.min(sorted[i].lx, max);
    }
    markers.innerHTML = sorted.map((it) => it.kind
      ? `<button class="marker" data-kind="${it.kind}" style="left:${it.lx}px" aria-label="Best ${it.kind} view, ${fmtTime(it.kind === "day" ? d.day.m : d.night.m)}. Show details">${it.html}</button>`
      : `<div class="marker ${it.cls}" style="left:${it.lx}px">${it.html}</div>`).join("");
  }

  // ---------- App state ----------
  const state = {
    date: keyOf(new Date()),
    scrub: null,          // minutes while dragging the time line
    entry: { text: "", photos: [] },
    urls: [],
  };

  function currentMinutes() { return state.scrub != null ? state.scrub : nowMinutes(); }

  function updateLive() {
    const d = dayData(state.date);
    const m = currentMinutes();
    const nl = $("nowLine");
    if (nl) { nl.setAttribute("x1", xOf(m)); nl.setAttribute("x2", xOf(m)); }
    drawMarkers(d, m);
    const pos = moonAt(atMinutes(state.date, m));
    drawCompassMoon(pos.bearing, pos.alt);
    drawCloud(typeof wxAt === "function" ? wxAt(state.date, m) : null);
  }
  // A cloud (with rain when it's raining) over the moon when the sky is mostly covered.
  function drawCloud(w) {
    const g = $("wxIcon");
    if (!w || (w.cc < 70 && w.pr <= 0.1)) { g.innerHTML = ""; return; }
    const shapes = (attrs) => `<circle cx="9" cy="12" r="6" ${attrs}></circle><circle cx="16.5" cy="8" r="7.5" ${attrs}></circle><circle cx="23.5" cy="12.5" r="5.5" ${attrs}></circle><rect x="9" y="11" width="14.5" height="7" ${attrs}></rect>`;
    const rain = w.pr > 0.1 ? `<path d="M10 22.5 8.5 26.5M16 22.5 14.5 26.5M22 22.5 20.5 26.5" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" fill="none"></path>` : "";
    g.innerHTML = `<g transform="translate(55 51)">${shapes('fill="#1a1a1a" stroke="#1a1a1a" stroke-width="6"')}${shapes('fill="#edebe3"')}${rain}</g>`;
    g.setAttribute("aria-label", skyWord(w));
  }

  function renderDay() {
    const d = dayData(state.date);
    const dt = fromKey(state.date);
    $("dateTitle").innerHTML = `${WEEKDAYS[dt.getDay()]},<br>${dt.getMonth() + 1}/${dt.getDate()}`;
    document.title = "Moon Journal";
    drawChart(d);
    drawPhase(d);
    updateLive();
    const isToday = state.date === keyOf(new Date());
    $("todayBtn").hidden = isToday;
    document.body.classList.toggle("not-today", !isToday);

  // Scrubbing the time line
  (function scrub() {
    // The page doesn't scroll, so the chart takes every touch: press and drag to move the time line,
    // let go and it snaps back to now.
    let pid = null, moved = false, startX = 0, release = null;
    const show = (x) => { state.scrub = mOf(x); updateLive(); };
    chartWrap.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button.marker")) return;
      clearTimeout(release);
      pid = e.pointerId; moved = false; startX = e.clientX;
      try { chartWrap.setPointerCapture(pid); } catch (err) {}
      e.preventDefault();
      show(e.clientX);
    });
    chartWrap.addEventListener("pointermove", (e) => {
      if (e.pointerId !== pid) return;
      if (Math.abs(e.clientX - startX) > 3) moved = true;
      show(e.clientX);
    });
    const finish = (e) => {
      if (pid === null || (e && e.pointerId !== pid)) return;
      pid = null;
      // A quick tap leaves the line there for a moment so you can read it.
      release = setTimeout(() => { state.scrub = null; updateLive(); }, moved ? 0 : 1200);

    chartWrap.addEventListener("pointercancel", finish);

  // ---------- Journal ----------
  const entry = $("entry"), photosEl = $("photos"), saveState = $("saveState");

  let saving = Promise.resolve();
  function saveNow(announce) {

  async function loadEntry() {

    renderPhotos();

  // Keep the line being typed above the keyboard.
  const mirror = document.createElement("div");

    const cs = getComputedStyle(entry);
    ["fontFamily", "fontSize", "fontWeight", "lineHeight", "letterSpacing", "whiteSpace", "wordWrap", "padding", "border", "boxSizing"].forEach((p) => (mirror.style[p] = cs[p]));

    mark.textContent = "​";

    document.body.appendChild(mirror);
    const y = mark.offsetTop;
    mirror.remove();

  }
  const scroller = $("journalScroll");

    if (document.activeElement !== entry) return;

  // Photos: shrink, then add to the end of the entry.
  function shrink(file, max = 1800) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => resolve(b || file), "image/jpeg", 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

    const k = state.date;
    let failed = 0;
    for (const f of files) {
      const blob = await shrink(f);
      const id = Date.now() + "-" + Math.random().toString(36).slice(2, 7);
      const path = `${uid}/${k}/${id}.jpg`;

        await Store.upload(path, blob);

    await saveNow(!failed);
    if (failed) showSaved(failed === files.length ? "Couldn't upload. Check your connection." : `${failed} photo${failed > 1 ? "s" : ""} didn't upload.`, true);
    scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" });
  });

  // ---------- Best-view details ----------

    $("infoTime").textContent = fmtTime(s.m);
    $("infoKind").textContent = `${pre}${WEEKDAYS[dt.getDay()]} ${dt.getMonth() + 1}/${dt.getDate()} · ${phaseName(SunCalc.getMoonIllumination(atMinutes(state.date, s.m)).phase)}`;
    $("infoIllum").innerHTML = `${Math.round(s.frac * 100)}%<small>of the disc lit</small>`;
    $("infoDir").innerHTML = `${Math.round(s.bearing)}°<small>${cardinal(s.bearing)} from the house</small>`;
    $("infoAlt").innerHTML = s.alt >= 0 ? `${Math.round(s.alt)}°<small>above the horizon</small>` : `${Math.round(-s.alt)}°<small>below the horizon</small>`;
    $("infoSky").innerHTML = kind === "day" ? `Daylight<small>Sun ${Math.round(s.sunAlt)}° up</small>` : (s.sunAlt < -12 ? `Dark<small>full night</small>` : `Twilight<small>sky still glowing</small>`);
    const w = wxAt(state.date, s.m);
    if (w) $("infoSky").innerHTML = `${skyWord(w)}<small>${Math.round(w.cc)}% cloud cover</small>`;
    let note = "";
    if (s.alt < 0) note = kind === "day" ? "The Moon stays below the horizon all day. This is when it comes closest." : "The Moon stays below the horizon after dark. This is when it comes closest.";
    else if (s.alt < 10) note = "It's low in the sky, so trees and houses may block it. Try an open spot facing " + cardinal(s.bearing) + ".";
    else if (kind === "day" && s.elong < 25) note = "It's close to the Sun, so it will be hard to pick out. Shade your eyes from the Sun.";
    else if (s.frac < 0.08) note = "Only a thin sliver is lit, so it will be faint.";
    else if (kind === "night" && s.m < 720) note = "The Moon isn't up during the evening, so the best view is before sunrise.";
    if (w && (w.cc >= 70 || w.pr > 0.1)) note = (w.pr > 0.1 ? "Rain is expected then, " : "Clouds are expected then, ") + "so the Moon may be hidden. " + note;

  $("infoClose").addEventListener("click", closeInfo);
  $("moonInfo").addEventListener("click", (e) => { if (e.target === $("moonInfo")) closeInfo(); });

  // ---------- Calendar ----------
  let calMonth = null;
  async function renderCalendar() {
    const [y, mo] = calMonth;
    const g0 = new Date(y, mo, 1 - new Date(y, mo, 1).getDay());
    let saved = new Set();
    try { saved = await Store.dates(keyOf(g0), keyOf(new Date(g0.getFullYear(), g0.getMonth(), g0.getDate() + 41))); } catch (err) { /* dots appear when online */ }
    if (calMonth[0] !== y || calMonth[1] !== mo) return;

    let html = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);

  $("calNext").addEventListener("click", () => { calMonth = calMonth[1] === 11 ? [calMonth[0] + 1, 0] : [calMonth[0], calMonth[1] + 1]; renderCalendar(); });

  // ---------- Day navigation ----------
  // Page turn: the current day slides out, the new day slides in from the other side.
  const appEl = document.querySelector(".app");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let turning = false;
  async function turnTo(k, dir) {            // dir: +1 = forward (slides left), -1 = back (slides right)

  // Swipe left/right over the journal to change days; the page follows your finger.
  (function swipe() {
    const area = $("journal");
    let id = null, x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = null;
    area.addEventListener("pointerdown", (e) => {
      if (document.body.classList.contains("writing") || turning || e.pointerType === "mouse") return;
      id = e.pointerId; x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); dx = 0; mode = null;
    });
    area.addEventListener("pointermove", (e) => {
      if (e.pointerId !== id) return;
      dx = e.clientX - x0;
      const dy = e.clientY - y0;
      if (!mode) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        mode = Math.abs(dx) > Math.abs(dy) * 1.2 ? "swipe" : "scroll";
        if (mode === "swipe") { try { area.setPointerCapture(id); } catch (err) {} entry.blur(); }
      }
      if (mode === "swipe") { appEl.style.transform = `translateX(${dx}px)`; appEl.style.opacity = String(1 - Math.min(0.6, Math.abs(dx) / 600)); }
    });
    const end = async (e) => {
      if (e.pointerId !== id) return;
      id = null;
      if (mode !== "swipe") return;
      const fast = Math.abs(dx) > 30 && Math.abs(dx) / Math.max(1, Date.now() - t0) > 0.5;
      if (Math.abs(dx) > 80 || fast) {
        const dir = dx < 0 ? 1 : -1;
        await turnTo(addDays(state.date, dir), dir);
      } else {
        appEl.classList.add("sliding");
        appEl.style.transform = ""; appEl.style.opacity = "";
        setTimeout(() => appEl.classList.remove("sliding"), 200);
      }
    };
    area.addEventListener("pointerup", end);
    area.addEventListener("pointercancel", (e) => {
      if (e.pointerId === id && mode === "swipe") { appEl.style.transform = ""; appEl.style.opacity = ""; }
      if (e.pointerId === id) id = null;
    });
    // A swipe shouldn't also count as a tap that opens the keyboard.
    area.addEventListener("click", (e) => { if (mode === "swipe") { e.preventDefault(); e.stopPropagation(); mode = null; } }, true);
  })();

  // Block pinch-zoom (iPhone ignores the page's zoom setting for pinches).
  ["gesturestart", "gesturechange", "gestureend"].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  // ---------- Boot ----------
  // ---------- Location ----------
  function useLocation(loc) {
    const moved = Math.abs(loc.lat - LOC.lat) > 0.005 || Math.abs(loc.lng - LOC.lng) > 0.005;
    LOC = loc;
    $("placeName").textContent = loc.label;
    if (moved) { dayCache.clear(); renderDay(); }
    if (moved || loc.source === "device") syncSubscription();
  }
  // Town, state and ZIP for the label (free lookup, no key needed).
  const placeCache = {};
  async function placeName(lat, lng) {
    const key = lat + "," + lng;
    if (placeCache[key]) return placeCache[key];
    try {
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
      const j = await r.json();
      const town = j.city || j.locality;
      const st = (j.principalSubdivisionCode || "").split("-")[1] || j.principalSubdivision;
      const label = [town && st ? `${town}, ${st}` : town || st, j.postcode].filter(Boolean).join(" ");
      return (placeCache[key] = label || null);
    } catch (e) { return null; }
  }
  // A town picked by hand is remembered on this phone; "Current location" clears it.
  const LOC_KEY = "moon-journal-location";
  const savedLoc = () => { try { return JSON.parse(localStorage.getItem(LOC_KEY) || "null"); } catch (e) { return null; } };
  function locate() {
    const manual = savedLoc();
    if (manual && manual.lat != null) { useLocation({ ...manual, source: "manual" }); refreshWeather(); return; }
    if (!navigator.geolocation) { useLocation(DEFAULT_LOC); refreshWeather(); return; }
    try {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = Math.round(pos.coords.latitude * 100) / 100, lng = Math.round(pos.coords.longitude * 100) / 100;
          useLocation({ lat, lng, label: LOC.source === "device" ? LOC.label : "Current location", source: "device" });
          placeName(lat, lng).then((label) => { if (label && LOC.lat === lat && LOC.lng === lng) { LOC = { ...LOC, label }; $("placeName").textContent = label; } });
          refreshWeather();
        },
        () => { useLocation(DEFAULT_LOC); refreshWeather(); },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 30 * 60 * 1000 });
    } catch (e) { useLocation(DEFAULT_LOC); }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) locate(); });

  const STATES = { Alabama: "AL", Alaska: "AK", Arizona: "AZ", Arkansas: "AR", California: "CA", Colorado: "CO", Connecticut: "CT", Delaware: "DE", "District of Columbia": "DC", Florida: "FL", Georgia: "GA", Hawaii: "HI", Idaho: "ID", Illinois: "IL", Indiana: "IN", Iowa: "IA", Kansas: "KS", Kentucky: "KY", Louisiana: "LA", Maine: "ME", Maryland: "MD", Massachusetts: "MA", Michigan: "MI", Minnesota: "MN", Mississippi: "MS", Missouri: "MO", Montana: "MT", Nebraska: "NE", Nevada: "NV", "New Hampshire": "NH", "New Jersey": "NJ", "New Mexico": "NM", "New York": "NY", "North Carolina": "NC", "North Dakota": "ND", Ohio: "OH", Oklahoma: "OK", Oregon: "OR", Pennsylvania: "PA", "Rhode Island": "RI", "South Carolina": "SC", "South Dakota": "SD", Tennessee: "TN", Texas: "TX", Utah: "UT", Vermont: "VT", Virginia: "VA", Washington: "WA", "West Virginia": "WV", Wisconsin: "WI", Wyoming: "WY", "Puerto Rico": "PR" };
  const checkSvg = '<svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  let locResults = [], locTimer = null, locToken = 0;
  function renderLocList() {
    const manual = savedLoc();
    const current = `<button class="loc-row" data-i="current" type="button"><span><b>Current location</b><small>${!manual && LOC.source === "device" ? LOC.label.replace(/</g, "&lt;") : "Use this phone's location"}</small></span>${!manual ? checkSvg : ""}</button>`;
    const rows = locResults.map((r, i) => `<button class="loc-row" data-i="${i}" type="button"><span><b>${r.label.replace(/</g, "&lt;")}</b><small>${r.detail.replace(/</g, "&lt;")}</small></span>${manual && manual.label === r.label ? checkSvg : ""}</button>`);
    if (manual && !locResults.some((r) => r.label === manual.label)) rows.unshift(`<button class="loc-row" data-i="saved" type="button"><span><b>${manual.label.replace(/</g, "&lt;")}</b><small>Chosen location</small></span>${checkSvg}</button>`);
    $("locList").innerHTML = current + rows.join("");
  }
  async function searchPlaces(q) {
    const token = ++locToken;
    if (q.length < 2) { locResults = []; $("locNote").textContent = ""; renderLocList(); return; }
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=en&format=json`);
      const j = await r.json();
      if (token !== locToken) return;
      const zip = /^\d{5}$/.test(q) ? q : null;
      locResults = (j.results || []).map((p) => {
        const st = p.country_code === "US" ? (STATES[p.admin1] || p.admin1) : null;
        const label = (st ? `${p.name}, ${st}` : `${p.name}, ${p.country}`) + (zip ? ` ${zip}` : "");
        const detail = [p.admin2, p.admin1, p.country_code === "US" ? null : p.country].filter(Boolean).join(", ");
        return { label, detail: detail || p.country || "", lat: Math.round(p.latitude * 100) / 100, lng: Math.round(p.longitude * 100) / 100 };
      });
      locResults = locResults.filter((r, i, a) => a.findIndex((x) => x.label === r.label) === i);   // one row per town
      $("locNote").textContent = locResults.length ? "" : "No places found. Try a town name or a 5-digit ZIP code.";
    } catch (e) {
      if (token === locToken) $("locNote").textContent = "Couldn't search right now. Check your connection.";
      locResults = [];
    }
    renderLocList();
  }
  $("placeBtn").addEventListener("click", () => {
    $("locSearch").value = ""; locResults = []; $("locNote").textContent = "";
    renderLocList();
    $("locSheet").hidden = false;
    setTimeout(() => $("locSearch").focus(), 50);
  });
  $("locClose").addEventListener("click", () => { $("locSheet").hidden = true; });
  $("locSheet").addEventListener("click", (e) => { if (e.target === $("locSheet")) $("locSheet").hidden = true; });
  $("locSearch").addEventListener("input", () => { clearTimeout(locTimer); locTimer = setTimeout(() => searchPlaces($("locSearch").value.trim()), 300); });
  $("locSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(locTimer); searchPlaces($("locSearch").value.trim()); } });
  $("locList").addEventListener("click", (e) => {
    const b = e.target.closest(".loc-row");
    if (!b) return;
    const i = b.dataset.i;
    $("locSheet").hidden = true;
    if (i === "current") {
      try { localStorage.removeItem(LOC_KEY); } catch (err) {}
      LOC = { ...LOC, source: "default" };
      locate();
    } else if (i !== "saved") {
      const r = locResults[+i];
      const loc = { lat: r.lat, lng: r.lng, label: r.label, source: "manual" };
      try { localStorage.setItem(LOC_KEY, JSON.stringify(loc)); } catch (err) {}
      useLocation(loc);
      syncSubscription();
      refreshWeather();
    }
  });

  // ---------- Weather (clouds over the moon) ----------
  // Hourly cloud cover and rain for the chosen place, about a month back and a week ahead.
  const wx = { key: null, at: 0, hours: new Map() };
  async function refreshWeather() {
    const key = LOC.lat + "," + LOC.lng;
    if (wx.key === key && Date.now() - wx.at < 30 * 60 * 1000) return;
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LOC.lat}&longitude=${LOC.lng}&hourly=cloud_cover,precipitation&past_days=31&forecast_days=7&timezone=auto`);
      const j = await r.json();
      const hours = new Map();
      j.hourly.time.forEach((t, i) => hours.set(t, { cc: j.hourly.cloud_cover[i], pr: j.hourly.precipitation[i] }));
      Object.assign(wx, { key, at: Date.now(), hours });
      updateLive();
    } catch (e) { /* no clouds shown without data */ }
  }
  function wxAt(dateKey, minutes) {
    if (wx.key !== LOC.lat + "," + LOC.lng) return null;
    return wx.hours.get(`${dateKey}T${pad(Math.min(23, Math.floor(minutes / 60)))}:00`) || null;
  }
  const skyWord = (w) => (w.pr > 0.1 ? "Rain" : w.cc >= 70 ? "Cloudy" : w.cc >= 30 ? "Partly cloudy" : "Clear");
  setInterval(refreshWeather, 30 * 60 * 1000);

  let booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    renderDay();
    loadEntry();
    locate();
    if (needsTap && !sensorLive) $("compassHint").hidden = false;
    setInterval(() => { if (state.scrub == null) updateLive(); }, 20000);
    let lastW = 0;
    new ResizeObserver(() => {
      const w = chart.getBoundingClientRect().width;
      if (Math.abs(w - lastW) > 1) { lastW = w; drawChart(dayData(state.date)); updateLive(); }
    }).observe(chartWrap);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) updateLive(); });
  }
  // ---------- Reminders (push notifications) ----------
  // The phone subscribes once; Supabase sends the reminders on a schedule, using the
  // location and time zone saved with the subscription.
  const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let swReg = null;
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then((r) => { swReg = r; }).catch(() => {});
  }
  const b64ToBytes = (b) => {
    const s = (b + "=".repeat((4 - (b.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
    return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  };
  const remPrefs = () => ({ day: $("remDay").checked, night: $("remNight").checked, journal: $("remJournal").checked });
  async function currentSub() {
    if (!pushSupported) return null;
    const reg = swReg || (await navigator.serviceWorker.getRegistration());
    return reg ? reg.pushManager.getSubscription() : null;
  }
  async function saveSub(sub, prefs) {
    const j = sub.toJSON();
    const row = {
      user_id: uid, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth,
      lat: LOC.lat, lng: LOC.lng, tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      updated_at: new Date().toISOString(),
    };
    if (prefs) row.prefs = prefs;
    must(await sb.from("push_subscriptions").upsert(row, { onConflict: "endpoint" }));
  }
  // Keep the saved location and time zone current whenever the app opens.
  async function syncSubscription() {
    if (!uid || !pushSupported || Notification.permission !== "granted") return;
    try { const sub = await currentSub(); if (sub) await saveSub(sub); } catch (e) { /* tries again next open */ }
  }
  const remNote = (t) => { $("remNote").textContent = t; };
  async function renderReminders() {
    const sub = await currentSub().catch(() => null);
    $("remList").classList.toggle("off", !sub);
    $("remOn").hidden = !!sub;
    $("remOff").hidden = !sub;
    if (!pushSupported) {
      remNote(isIOS && !standalone
        ? "To get reminders, add Moon Journal to your Home Screen (Share, then Add to Home Screen) and open it from there."
        : "This browser can't show reminders.");
      $("remOn").hidden = true;
    } else if (isIOS && !standalone) {
      remNote("Open Moon Journal from your Home Screen to turn on reminders.");
      $("remOn").hidden = true;
    } else if (!CFG.vapidPublicKey) {
      remNote("Reminders aren't set up yet: config.js needs the vapidPublicKey.");
      $("remOn").hidden = true;
    } else if (Notification.permission === "denied") {
      remNote("Notifications are blocked for Moon Journal. Turn them on in Settings, Notifications, Moon Journal, then come back.");
      $("remOn").hidden = true;
    } else if (sub) {
      remNote("Reminders are on for this phone. Times follow your current location.");
      try {
        const row = must(await sb.from("push_subscriptions").select("prefs").eq("endpoint", sub.endpoint).maybeSingle());
        if (row && row.prefs) { $("remDay").checked = row.prefs.day !== false; $("remNight").checked = row.prefs.night !== false; $("remJournal").checked = row.prefs.journal !== false; }
      } catch (e) { /* keep what's shown */ }
    } else {
      remNote("");
    }
  }
  $("remindersBtn").addEventListener("click", async () => {
    $("calendar").hidden = true;
    $("reminders").hidden = false;
    await renderReminders();
  });
  $("remClose").addEventListener("click", () => { $("reminders").hidden = true; });
  $("reminders").addEventListener("click", (e) => { if (e.target === $("reminders")) $("reminders").hidden = true; });
  $("remOn").addEventListener("click", async () => {
    $("remOn").disabled = true;
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { remNote("Notifications weren't allowed. You can turn them on in Settings, Notifications, Moon Journal."); return; }
      const reg = swReg || (await navigator.serviceWorker.ready);
      const sub = (await reg.pushManager.getSubscription()) ||
        (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(CFG.vapidPublicKey) }));
      await saveSub(sub, remPrefs());
      await renderReminders();
    } catch (e) {
      remNote("Couldn't turn on reminders. Check your connection and try again.");
    } finally { $("remOn").disabled = false; }
  });
  $("remOff").addEventListener("click", async () => {
    try {
      const sub = await currentSub();
      if (sub) {
        await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
        await sub.unsubscribe();
      }
    } catch (e) { /* already off */ }
    await renderReminders();
  });
  ["remDay", "remNight", "remJournal"].forEach((id) => $(id).addEventListener("change", async () => {
    try { const sub = await currentSub(); if (sub) await saveSub(sub, remPrefs()); }
    catch (e) { remNote("Couldn't save that change. Check your connection."); }
  }));

  // Opening the app from a reminder jumps to that day (and the moon details).
  async function openFromLink() {
    const q = new URLSearchParams(location.search);
    const date = q.get("date"), open = q.get("open");
    if (!date && !open) return;
    history.replaceState(null, "", location.pathname);
    if (date && /^\d{4}-\d{2}-\d{2}$/.test(date) && date !== state.date) await goTo(date);
    if (open === "day" || open === "night") openInfo(open);
  }

  // ---------- Status bar color ----------
  // iPhone sometimes keeps an old status-bar tint after an overlay closes; re-setting the theme color refreshes it.
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  function refreshStatusBar() {
    if (!themeMeta) return;
    themeMeta.setAttribute("content", "#edebe4");
    requestAnimationFrame(() => themeMeta.setAttribute("content", "#edebe3"));
  }
  const overlayWatch = new MutationObserver(refreshStatusBar);
  document.querySelectorAll(".overlay").forEach((o) => overlayWatch.observe(o, { attributes: true, attributeFilter: ["hidden"] }));

  // ---------- Sign-in ----------
  const loginMsg = (el, text, error) => { el.textContent = text; el.classList.toggle("error", !!error); };
  function showLogin(mode) {
    $("appRoot").hidden = true;
    $("login").hidden = false;
    const recover = mode === "reset";
    $("loginForm").hidden = recover;
    $("resetForm").hidden = !recover;
    $("loginSub").textContent = recover ? "Choose a new password for your journal." : "Sign in to see tonight's moon and your journal.";
    const now = new Date();
    if (sb) $("versionTag").textContent = `Version 2026-10-26i · ${CFG.supabaseUrl.replace(/^https:\/\//, "").split(".")[0]}`;
    $("loginMoon").innerHTML = phaseIcon(SunCalc.getMoonIllumination(now).phase, 112, 3, "hatch");
  }
  function enterApp(session) {
    const newUser = uid !== session.user.id;
    uid = session.user.id;
    $("acctEmail").textContent = session.user.email || "";
    $("login").hidden = true;
    $("appRoot").hidden = false;
    if (!booted) boot();
    else if (newUser) { renderDay(); loadEntry(); }
    openFromLink();
    syncSubscription();
  }
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim(), password = $("password").value;
    if (!email || !password) return loginMsg($("loginMsg"), "Enter your email and password.", true);
    $("loginBtn").disabled = true; loginMsg($("loginMsg"), "Signing in…");
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      loginMsg($("loginMsg"), "");
      $("password").value = "";
      enterApp(data.session);
    } catch (err) {
      const m = (err && err.message) || "";
      let text;
      if (/invalid login credentials/i.test(m)) text = "That email and password don't match.";
      else if (/invalid api key|no api key|apikey|jwt/i.test(m)) text = "The Supabase key in config.js isn't right. Copy the anon key again with the copy button.";
      else if (/not confirmed/i.test(m)) text = "This account isn't confirmed yet. In Supabase, recreate the user with Auto Confirm checked.";
      else if (/logins are disabled|provider is disabled/i.test(m)) text = "Email sign-in is turned off in Supabase. Turn the Email provider back on (only sign-ups should be off).";
      else if (/failed to fetch|network|load failed/i.test(m)) text = "Couldn't reach Supabase. Check the project URL in config.js.";
      else text = "Sign-in failed: " + (m || "unknown error");
      loginMsg($("loginMsg"), text, true);
      console.error("Sign-in error:", err);
    } finally { $("loginBtn").disabled = false; }
  });
  $("forgotBtn").addEventListener("click", async () => {
    const email = $("email").value.trim();
    if (!email) { $("email").focus(); return loginMsg($("loginMsg"), "Enter your email first, then tap Forgot password.", true); }
    loginMsg($("loginMsg"), "Sending…");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    loginMsg($("loginMsg"), error ? "Couldn't send the email. Try again in a minute." : "Check your email for a link to reset your password.", !!error);
  });
  $("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = $("newPassword").value;
    if (password.length < 8) return loginMsg($("resetMsg"), "Use at least 8 characters.", true);
    $("resetBtn").disabled = true;
    const { data, error } = await sb.auth.updateUser({ password });
    $("resetBtn").disabled = false;
    if (error) return loginMsg($("resetMsg"), "Couldn't save that password. Open the reset link again.", true);
    history.replaceState(null, "", location.pathname);
    const { data: { session } } = await sb.auth.getSession();
    if (session) enterApp(session);
  });
  $("signOutBtn").addEventListener("click", async () => {
    if (saveTimer) await saveNow();
    $("calendar").hidden = true;
    await sb.auth.signOut();
    uid = null;
    state.entry = { text: "", photos: [] };
    entry.value = "";
    photosEl.innerHTML = "";
    showLogin();
  });

  async function start() {
    if (typeof SunCalc === "undefined") {
      document.body.innerHTML = '<p style="padding:40px 24px;font-family:sans-serif">Moon data didn\'t load. Check your connection and reload.</p>';
      return;
    }
    if (!sb) {
      showLogin();
      $("loginForm").hidden = true;
      $("loginSub").textContent = !window.supabase
        ? "The sign-in code didn't load. Check your connection and reload."
        : !window.MOON_CONFIG
          ? "config.js didn't load. Reload the page; if it keeps happening, check config.js is in the repo."
          : "Almost there: config.js still has the placeholder URL or key. Add your Supabase project URL and anon key, then push.";
      return;
    }
    const recovering = /type=recovery/.test(location.hash);
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") showLogin("reset");
      else if (event === "SIGNED_OUT") { if (!$("appRoot").hidden) showLogin(); }
      else if (session && event === "TOKEN_REFRESHED") uid = session.user.id;
    });
    const { data: { session } } = await sb.auth.getSession();
    if (recovering) showLogin("reset");
    else if (session) enterApp(session);
    else showLogin();
  }
  start();
})();
</script>
